<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espinas Bellas | Premium Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --verde: #1b4332;
            --verde-claro: #2d6a4f;
            --amarillo: #ffca3a;
            --crema: #f8f9fa;
            --oscuro: #081c15;
            --rojo: #e63946;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: #f0f2f5; color: var(--oscuro); padding-bottom: 100px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

        nav { 
            background: var(--verde); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .nav-logo { font-family: 'Playfair Display', serif; color: var(--amarillo); font-size: 1.6rem; font-weight: 900; outline: none; transition: var(--transition); }
        .nav-logo:focus { border-bottom: 2px solid var(--amarillo); }

        header {
            background-size: cover; background-position: center;
            padding: 80px 20px; text-align: center; color: white; 
            border-bottom: 6px solid var(--amarillo);
            position: relative; overflow: hidden;
            transition: var(--transition);
        }
        .header-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)); z-index: 1; }
        .header-content { position: relative; z-index: 2; }
        
        #store-logo { 
            width:130px; height:130px; border-radius:50%; border:4px solid var(--amarillo); 
            object-fit:cover; background: white; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: var(--transition);
        }
        #store-logo:hover { transform: scale(1.05); }

        .search-container { padding: 20px 8%; background: white; margin-bottom: 15px; box-shadow: var(--shadow-soft); }
        #search-input { 
            width: 100%; padding: 12px 20px; border: 2px solid #eee; border-radius: 50px; 
            font-size: 1rem; transition: var(--transition); outline: none;
        }
        #search-input:focus { border-color: var(--verde-claro); box-shadow: 0 0 15px rgba(45, 106, 79, 0.1); }

        .container { padding: 15px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { 
            background: white; border-radius: 20px; overflow: hidden; 
            box-shadow: var(--shadow-soft); position: relative; text-align: center; 
            border: 1px solid rgba(0,0,0,0.03); transition: var(--transition);
            display: flex; flex-direction: column; will-change: transform;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .card img.card-img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; }
        
        .badge-agotado { 
            position: absolute; top: 12px; right: 12px; background: var(--rojo); 
            color: white; padding: 5px 10px; border-radius: 10px; font-size: 0.7rem; 
            font-weight: 800; z-index: 5; box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }

        button { padding: 10px 20px; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-y { background: var(--amarillo); color: var(--oscuro); box-shadow: 0 4px 15px rgba(255, 202, 58, 0.2); }
        .btn-y:hover { background: #f9bc15; transform: scale(1.03); }
        .btn-v { background: var(--verde-claro); color: white; box-shadow: 0 4px 15px rgba(45, 106, 79, 0.2); }
        .btn-v:hover { background: var(--verde); transform: scale(1.03); }

        .sidebar { 
            position: fixed; top: 0; right: -100%; width: 380px; max-width: 95%; height: 100%; 
            background: var(--glass); backdrop-filter: blur(12px); z-index: 5000; 
            transition: 0.5s cubic-bezier(0.7, 0, 0.3, 1); padding: 25px; 
            box-shadow: -15px 0 35px rgba(0,0,0,0.15); overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .sidebar label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; color: var(--oscuro); }

        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 6000; justify-content: center; align-items: center; 
            backdrop-filter: blur(4px);
        }
        .modal-content { 
            background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 850px; 
            max-height: 85vh; overflow-y: auto; display: flex; gap: 25px; position: relative; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.8rem; color: #888; cursor: pointer; }
        
        .modal-gallery { flex: 1.2; display: flex; flex-direction: column; gap: 12px; }
        .modal-main-img { width: 100%; height: 300px; object-fit: cover; border-radius: 12px; }
        .modal-thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; align-items: center; }
        
        .modal-thumb-wrap { position: relative; flex-shrink: 0; }
        .modal-thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; }
        .modal-thumbs img.active { border-color: var(--verde); opacity: 1; }
        
        .modal-thumb-del {
            position: absolute; top: -5px; right: -5px;
            background: var(--rojo); color: white; border: none;
            border-radius: 50%; width: 20px; height: 20px;
            font-size: 10px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        .modal-thumb-add {
            width: 60px; height: 60px; border-radius: 8px; cursor: pointer;
            border: 2px dashed var(--verde); display: flex; align-items: center;
            justify-content: center; font-size: 1.5rem; color: var(--verde);
            background: #fff; flex-shrink: 0;
        }

        .modal-details { flex: 1; display: flex; flex-direction: column; }
        .modal-details h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--oscuro); margin-bottom: 8px; }
        .modal-details h3 { color: var(--verde-claro); font-size: 1.5rem; margin-bottom: 15px; font-weight: 800; }
        .modal-section { margin-bottom: 15px; background: #f9f9f9; padding: 12px; border-radius: 10px; }
        .modal-section h4 { font-size: 0.95rem; color: var(--oscuro); margin-bottom: 6px; }
        .modal-section p { color: #555; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; }
        .editable-field { padding: 4px; border-radius: 4px; }
        .editable-field[contenteditable="true"] { background: white; border: 1px dashed var(--amarillo); outline: none; }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; padding: 20px; gap: 15px; }
            .modal-main-img { height: 220px; }
            header { padding: 50px 15px; }
        }

        .admin-footer { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--oscuro); 
            padding: 15px; display: none; justify-content: center; gap: 12px; z-index: 4000; 
            border-top: 3px solid var(--amarillo); flex-wrap: wrap;
        }
        body.admin-mode .admin-footer { display: flex; }
        #diag-panel { display: none; background: white; border-radius: 15px; padding: 20px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body id="main-body">

    <nav>
        <div class="nav-logo" id="nav-title" onblur="if(isBoss) saveChanges()">ESPINAS BELLAS</div>
        <div style="display:flex; gap:10px;">
            <button class="btn-y" onclick="openSidebar('cart-sidebar')">🛒 <span id="cart-count">0</span></button>
            <button class="btn-y" onclick="openSidebar('user-sidebar')">👤 Perfil</button>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 ¿Qué estás buscando hoy? Escribe aquí..." oninput="filterProducts()">
    </div>

    <header id="dynamic-header" onclick="if(isBoss) editBackground()">
        <div class="header-overlay"></div>
        <div class="header-content">
            <img src="https://dummyimage.com/130x130/ffffff/1b4332.png&text=Logo" id="store-logo" title="Clic para cambiar logo" onclick="event.stopPropagation(); if(isBoss) editLogo()" alt="Logo Tienda">
            <h1 id="store-name" style="font-family: 'Playfair Display', serif; font-size: 2.4rem; margin-top: 10px;" onblur="if(isBoss) saveChanges()">Cargando...</h1>
            <p id="store-slogan" style="font-size: 1.05rem; opacity: 0.9;" onblur="if(isBoss) saveChanges()">Calidad y Frescura garantizada</p>
        </div>
    </header>

    <section class="container">
        <div class="grid" id="product-grid"></div>

        <div id="diag-panel">
            <h3 style="color:var(--verde); margin-bottom:12px;">🛠️ Análisis de Salud del Sistema</h3>
            <div id="diag-results" style="line-height: 1.6; color: #555; font-size: 0.95rem;"></div>
            <button class="btn-v" onclick="document.getElementById('diag-panel').style.display='none'" style="width:100%; margin-top:15px;">Finalizar Revisión</button>
        </div>
    </section>

    <!-- Modal de Detalles del Producto -->
    <div id="product-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal(true)">&times;</button>
            
            <div class="modal-gallery">
                <img id="modal-main-img" class="modal-main-img" src="" alt="Imagen principal">
                <div id="modal-thumbs" class="modal-thumbs"></div>
                <input type="file" id="local-file-input" style="display:none" accept="image/*" onchange="handleLocalFileSelect(event)">
            </div>
            
            <div class="modal-details">
                <h2 id="modal-title" class="editable-field">Cargando...</h2>
                <h3 id="modal-price" class="editable-field">$0</h3>
                
                <div class="modal-section">
                    <h4>📝 Descripción:</h4>
                    <p id="modal-desc" class="editable-field"></p>
                </div>
                
                <div class="modal-section">
                    <h4>✨ Características:</h4>
                    <p id="modal-features" class="editable-field"></p>
                </div>

                <div id="modal-stock-container" style="display:none; margin-bottom:12px; background: #fff3cd; padding:8px; border-radius:8px; border: 1px solid #ffe69c;">
                    <label style="font-weight:bold; color:#856404; font-size:0.85rem;">📦 Stock Actual:</label>
                    <input type="number" id="modal-stock" style="width:70px; padding:4px; margin-left:8px; border:1px solid #ccc; border-radius:4px;">
                </div>

                <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
                    <button id="modal-add-cart" class="btn-v" style="padding: 14px; font-size:1rem; width:100%;">🛒 Añadir al Carrito</button>
                    <button id="modal-save-btn" class="btn-y" style="display:none; width:100%; background:var(--oscuro); color:white;" onclick="saveModalChanges()">💾 Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar de Perfil y Admin -->
    <aside class="sidebar" id="user-sidebar">
        <button class="btn-y" onclick="closeSidebars()" style="margin-bottom:20px;">← Volver</button>
        
        <div id="auth-section">
            <h2 id="auth-status" style="margin-bottom:15px; font-size: 1.5rem;">Inicia Sesión</h2>
            
            <div id="login-view">
                <input type="email" id="login-email" placeholder="Correo Electrónico o ID">
                <input type="password" id="login-pass" placeholder="Contraseña">
                <button class="btn-v" style="width:100%; margin-top:5px;" onclick="signIn()">Entrar al Sistema</button>
                <button class="btn-y" style="width:100%; margin-top:10px;" onclick="switchAuth(true)">Crear cuenta nueva</button>
            </div>
            
            <div id="register-view" style="display:none;">
                <input type="text" id="reg-name" placeholder="Nombre completo">
                <input type="email" id="reg-email" placeholder="Correo">
                <input type="password" id="reg-pass" placeholder="Contraseña">
                <button class="btn-v" style="width:100%;" onclick="signUp()">Registrarme</button>
                <button onclick="switchAuth(false)" style="background:none; color:var(--verde); width:100%; margin-top:10px; font-size:0.85rem; font-weight: bold; border:none; cursor:pointer;">Ya tengo una cuenta</button>
            </div>
            
            <button id="logout-btn" class="btn-v" style="background:var(--rojo); display:none; width:100%; margin-top:15px;" onclick="signOut()">Cerrar Mi Sesión</button>
        </div>

        <div id="admin-settings-ui" style="display:none; margin-top:25px; border-top:2px solid #ddd; padding-top:20px;">
            <h3 style="color:var(--verde); margin-bottom:15px; font-size: 1.2rem;">⚙️ Panel de Control</h3>
            <div><label>WhatsApp:</label><input type="text" id="edit-wa" placeholder="Ej: 57321..."></div>
            <div><label>Nueva ID / Correo:</label><input type="text" id="edit-boss-id"></div>
            <div><label>Nueva Clave:</label><input type="password" id="edit-boss-pass"></div>
            <div style="margin-top: 8px;">
                <label style="color: var(--rojo);">Confirma clave actual:</label>
                <input type="password" id="confirm-old-pass" placeholder="Clave actual" style="border: 2px solid var(--amarillo);">
            </div>
            <button class="btn-v" style="width:100%; background:var(--oscuro); margin-top: 10px;" onclick="updateAdminCreds()">Aplicar Cambios</button>
        </div>
    </aside>

    <!-- Sidebar de Carrito -->
    <aside class="sidebar" id="cart-sidebar">
        <button class="btn-y" onclick="closeSidebars()">← Volver</button>
        <h2 style="margin:20px 0 15px; font-size: 1.4rem;">Tu Pedido Actual</h2>
        <div id="cart-items-list" style="max-height: 45vh; overflow-y: auto;"></div>
        <div style="padding-top: 15px; border-top: 2px solid #eee; margin-top: 15px;">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.4rem;">
                <span>Total:</span><span id="cart-total">$0</span>
            </div>
            <button class="btn-v" style="width:100%; margin-top:20px; padding: 15px;" onclick="checkout()">🚀 FINALIZAR EN WHATSAPP</button>
        </div>
    </aside>

    <footer class="admin-footer">
        <button class="btn-y" onclick="runDiagnostics()">🔍 Diagnóstico</button>
        <button class="btn-v" onclick="addProduct()">✨ Nuevo Producto</button>
        <button class="btn-y" onclick="saveChanges()">💾 GUARDAR CAMBIOS</button>
        <button class="btn-v" style="background:var(--rojo);" onclick="exitBossMode()">Cerrar Edición</button>
    </footer>

    <!-- SCRIPT ULTRA OPTIMIZADO -->
    <script>
        let isBoss = false;
        let bossCreds = { id: "24375245", pass: "1234", wa: "3212968875" };
        let allProductsData = {};
        let cart = [];
        let currentModalKey = null;
        let db, auth;

        function openSidebar(id) { document.getElementById(id).classList.add('active'); }
        function closeSidebars() { document.querySelectorAll('.sidebar').forEach(s => s.classList.remove('active')); }

        function exitBossMode() {
            isBoss = false;
            document.body.classList.remove('admin-mode');
            document.getElementById('admin-settings-ui').style.display = 'none';
            ["nav-title", "store-name", "store-slogan"].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.contentEditable = false;
            });
            document.getElementById('auth-status').innerText = "Inicia Sesión";
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'none';
            closeSidebars(); renderProducts();
        }

        // Renderizado optimizado mediante DocumentFragment para evitar bloqueos en móviles
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if(!grid) return;
            
            const fragment = document.createDocumentFragment();
            grid.innerHTML = ""; // Limpieza rápida

            for(let k in allProductsData) {
                const p = allProductsData[k];
                const stock = p.stock || 0;
                const mainImg = (p.imagenes && p.imagenes.length > 0) ? p.imagenes[0] : (p.imagen || "https://dummyimage.com/400x300/f0f2f5/081c15.png&text=Sin+Imagen");

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.dataset.key = k;
                cardDiv.dataset.name = (p.nombre || '').toLowerCase();

                cardDiv.innerHTML = `
                    ${stock <= 0 ? '<div class="badge-agotado">AGOTADO</div>' : ''}
                    <img src="${mainImg}" class="card-img" loading="lazy" onclick="openProductModal('${k}')" title="Clic para ver detalles" alt="${p.nombre || 'Producto'}">
                    
                    <div style="padding:15px; flex-grow: 1; display: flex; flex-direction: column;">
                        <h3 class="e-n" contenteditable="${isBoss}" style="font-size:1.1rem;">${p.nombre || 'Producto'}</h3>
                        <p class="e-p" contenteditable="${isBoss}" style="color:var(--verde-claro); font-weight:800; font-size:1.1rem; margin: 8px 0;">${p.precio || '$0'}</p>
                        ${isBoss ? `<div style="font-size:0.8rem; color:#888;">Stock: <input type="number" class="e-s" value="${stock}" style="width:55px; padding:3px;"></div>` : ''}
                        
                        <div style="display: flex; gap: 8px; margin-top: auto; padding-top: 10px;">
                            <button class="btn-y" style="flex:1; font-size: 0.85rem; padding: 8px;" onclick="openProductModal('${k}')">👁️ Detalles</button>
                            <button class="btn-v" style="flex:1; font-size: 0.85rem; padding: 8px;" onclick="addToCart('${k}')" ${stock <= 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                                ${stock <= 0 ? 'Agotado' : '🛒 Añadir'}
                            </button>
                        </div>
                        
                        ${isBoss ? `<p onclick="del('${k}')" style="color:red; cursor:pointer; font-size:0.75rem; margin-top:12px; font-weight:bold;">🗑️ ELIMINAR</p>` : ''}
                    </div>`;
                
                fragment.appendChild(cardDiv);
            }
            grid.appendChild(fragment);
        }

        function openProductModal(k) {
            currentModalKey = k;
            const p = allProductsData[k];
            const stock = p.stock || 0;
            
            let imgs = (p.imagenes && p.imagenes.length > 0) ? p.imagenes : (p.imagen ? [p.imagen] : ["https://dummyimage.com/400x300/f0f2f5/081c15.png&text=Sin+Imagen"]);
            
            document.getElementById('modal-main-img').src = imgs[0];
            let thumbHTML = '';
            imgs.forEach((img, idx) => {
                thumbHTML += `
                    <div class="modal-thumb-wrap">
                        <img src="${img}" class="${idx === 0 ? 'active' : ''}" loading="lazy" onclick="changeModalMainImg(this, '${img}')" alt="Miniatura">
                        ${isBoss ? `<button class="modal-thumb-del" onclick="event.stopPropagation(); deleteModalImage(${idx})">🗑️</button>` : ''}
                    </div>`;
            });

            if (isBoss) {
                thumbHTML += `<div class="modal-thumb-add" onclick="promptAddImage()">+</div>`;
            }

            document.getElementById('modal-thumbs').innerHTML = thumbHTML;
            document.getElementById('modal-title').innerText = p.nombre || "Producto sin nombre";
            document.getElementById('modal-price').innerText = p.precio || "$0";
            document.getElementById('modal-desc').innerText = p.descripcion || "Sin descripción detallada.";
            document.getElementById('modal-features').innerText = p.caracteristicas || "Sin características.";

            const btnCart = document.getElementById('modal-add-cart');
            btnCart.onclick = () => { addToCart(k); };
            if(stock <= 0) {
                btnCart.disabled = true; btnCart.innerText = "Producto Agotado"; btnCart.style.background = "var(--rojo)";
            } else {
                btnCart.disabled = false; btnCart.innerText = "🛒 Añadir al Carrito"; btnCart.style.background = "var(--verde-claro)";
            }

            ['modal-title', 'modal-price', 'modal-desc', 'modal-features'].forEach(id => {
                document.getElementById(id).contentEditable = isBoss;
            });
            
            document.getElementById('modal-stock-container').style.display = isBoss ? 'flex' : 'none';
            if(isBoss) document.getElementById('modal-stock').value = stock;
            document.getElementById('modal-save-btn').style.display = isBoss ? 'block' : 'none';
            document.getElementById('product-modal').style.display = 'flex';
        }

        function promptAddImage() {
            if (!isBoss || !currentModalKey) return;
            const opcion = confirm("¿Cómo deseas agregar la nueva imagen?\n\n• Aceptar: Buscar archivo local.\n• Cancelar: Pegar URL de internet.");
            if (opcion) {
                document.getElementById('local-file-input').click();
            } else {
                const url = prompt("Ingresa la URL de la imagen:");
                if (url && url.trim() !== "") saveNewImageToProduct(url.trim());
            }
        }

        function handleLocalFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { saveNewImageToProduct(e.target.result); };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function saveNewImageToProduct(imgSrc) {
            if (!currentModalKey || !db) return;
            let p = allProductsData[currentModalKey];
            let imgs = p.imagenes ? [...p.imagenes] : (p.imagen ? [p.imagen] : []);
            imgs.push(imgSrc);
            db.ref(`productos/${currentModalKey}/imagenes`).set(imgs).then(() => {
                db.ref(`productos/${currentModalKey}/imagen`).set(imgs[0]);
            });
        }

        function deleteModalImage(index) {
            if (!isBoss || !currentModalKey || !db) return;
            let p = allProductsData[currentModalKey];
            let imgs = p.imagenes ? [...p.imagenes] : (p.imagen ? [p.imagen] : []);
            if (imgs.length <= 1) return alert("Debe tener al menos una imagen.");
            if (confirm("¿Eliminar esta imagen?")) {
                imgs.splice(index, 1);
                db.ref(`productos/${currentModalKey}/imagenes`).set(imgs).then(() => {
                    db.ref(`productos/${currentModalKey}/imagen`).set(imgs[0]);
                });
            }
        }

        function changeModalMainImg(element, src) {
            document.getElementById('modal-main-img').src = src;
            document.querySelectorAll('.modal-thumbs img').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }

        function closeModal(force = false, e = null) {
            if(force || (e && (e.target.classList.contains('modal-overlay') || e.target.classList.contains('close-modal')))) {
                document.getElementById('product-modal').style.display = 'none';
                currentModalKey = null;
            }
        }

        function addToCart(key) {
            const p = allProductsData[key], existing = cart.find(i => i.key === key);
            const currentStock = p.stock || 0;
            if(existing) {
                if(existing.qty < currentStock) existing.qty++; else return alert("No hay más unidades disponibles.");
            } else { cart.push({key, name: p.nombre, price: p.precio, qty: 1}); }
            updateCartUI();
        }

        function updateCartQty(key, delta) {
            const item = cart.find(i => i.key === key), p = allProductsData[key];
            if(item) {
                item.qty += delta;
                if(item.qty > (p.stock || 0)) { item.qty = (p.stock || 0); alert("Stock máximo alcanzado"); }
                if(item.qty <= 0) cart = cart.filter(i => i.key !== key);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list'); list.innerHTML = "";
            let total = 0, count = 0;
            cart.forEach(item => {
                const pNum = parseInt(item.price.replace(/\D/g,'')) || 0; 
                const sub = pNum * item.qty;
                total += sub; count += item.qty;
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; background:white; padding:12px; border-radius:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                        <div><b style="font-size:1rem;">${item.name}</b><br><small style="color:var(--verde-claro); font-weight:700;">$${sub.toLocaleString()}</small></div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button style="padding: 4px 8px;" onclick="updateCartQty('${item.key}', -1)">-</button>
                            <span style="font-weight:800;">${item.qty}</span>
                            <button style="padding: 4px 8px;" onclick="updateCartQty('${item.key}', 1)">+</button>
                        </div>
                    </div>`;
            });
            document.getElementById('cart-total').innerText = "$" + total.toLocaleString();
            document.getElementById('cart-count').innerText = count;
        }

        function switchAuth(isReg) {
            document.getElementById('login-view').style.display = isReg ? 'none' : 'block';
            document.getElementById('register-view').style.display = isReg ? 'block' : 'none';
        }

        function filterProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.style.display = c.dataset.name.includes(q) ? 'flex' : 'none');
        }

        // INICIALIZACIÓN FIREBASE SEGURA
        try {
            if (typeof firebase !== 'undefined') {
                const firebaseConfig = {
                    apiKey: "AIzaSyAOCuJ_tFSsKKqKXtgGvrrZgWDAPqt2uEk",
                    authDomain: "fruteria-las-espinas.firebaseapp.com",
                    databaseURL: "https://fruteria-las-espinas-default-rtdb.firebaseio.com",
                    projectId: "fruteria-las-espinas"
                };
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                auth = firebase.auth();

                window.saveModalChanges = function() {
                    if(!isBoss || !currentModalKey) return;
                    const up = {};
                    up[`productos/${currentModalKey}/nombre`] = document.getElementById('modal-title').innerText;
                    up[`productos/${currentModalKey}/precio`] = document.getElementById('modal-price').innerText;
                    up[`productos/${currentModalKey}/descripcion`] = document.getElementById('modal-desc').innerText;
                    up[`productos/${currentModalKey}/caracteristicas`] = document.getElementById('modal-features').innerText;
                    up[`productos/${currentModalKey}/stock`] = parseInt(document.getElementById('modal-stock').value) || 0;
                    db.ref().update(up).then(() => { alert('¡Guardado exitoso!'); });
                };

                window.checkout = function() {
                    if(cart.length === 0) return alert("Tu carrito está vacío.");
                    let msg = `*🛒 NUEVO PEDIDO - ESPINAS BELLAS*\n---------------------------\n`;
                    cart.forEach(i => msg += `✅ ${i.qty}x ${i.name} (${i.price})\n`);
                    msg += `---------------------------\n*💰 TOTAL: ${document.getElementById('cart-total').innerText}*`;
                    
                    const up = {};
                    cart.forEach(i => {
                        const nS = (allProductsData[i.key].stock || 0) - i.qty;
                        up[`productos/${i.key}/stock`] = nS < 0 ? 0 : nS;
                    });
                    db.ref().update(up).then(() => { 
                        window.open(`https://wa.me/${bossCreds.wa.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank'); 
                        cart = []; updateCartUI(); closeSidebars(); 
                    });
                };

                window.editBackground = function() { const url = prompt("URL de fondo:"); if(url) db.ref('config/background').set(url); };
                window.editLogo = function() { const url = prompt("URL de nuevo logo:"); if(url) db.ref('config/logo').set(url); };

                window.runDiagnostics = function() {
                    const res = document.getElementById('diag-results'); 
                    document.getElementById('diag-panel').style.display = 'block';
                    res.innerHTML = `🔹 <b>Firebase:</b> Conectado.<br>🔹 <b>Catálogo:</b> ${Object.keys(allProductsData).length} productos.<br>🔹 <b>WhatsApp:</b> +${bossCreds.wa}.`;
                };

                window.saveChanges = function() {
                    const up = {};
                    up['config/nav_title'] = document.getElementById('nav-title').innerText;
                    up['config/name'] = document.getElementById('store-name').innerText;
                    up['config/slogan'] = document.getElementById('store-slogan').innerText;
                    document.querySelectorAll('.card').forEach(c => {
                        const k = c.dataset.key;
                        up[`productos/${k}/nombre`] = c.querySelector('.e-n').innerText;
                        up[`productos/${k}/precio`] = c.querySelector('.e-p').innerText;
                        if(isBoss) up[`productos/${k}/stock`] = parseInt(c.querySelector('.e-s').value || 0);
                    });
                    db.ref().update(up).then(() => alert("Actualizado correctamente."));
                };

                window.updateAdminCreds = function() {
                    const old = document.getElementById('confirm-old-pass').value;
                    if(old !== bossCreds.pass) return alert("La clave actual no coincide.");
                    const newObj = {
                        id: document.getElementById('edit-boss-id').value || bossCreds.id,
                        pass: document.getElementById('edit-boss-pass').value || bossCreds.pass,
                        wa: document.getElementById('edit-wa').value || bossCreds.wa
                    };
                    db.ref('config/admin').set(newObj).then(() => { alert("Credenciales actualizadas. Recargando..."); location.reload(); });
                };

                window.signUp = function() {
                    const e = document.getElementById('reg-email').value, p = document.getElementById('reg-pass').value, n = document.getElementById('reg-name').value;
                    auth.createUserWithEmailAndPassword(e, p).then(r => r.user.updateProfile({displayName: n}).then(() => location.reload())).catch(err => alert(err.message));
                };

                window.signIn = function() {
                    const e = document.getElementById('login-email').value;
                    const p = document.getElementById('login-pass').value;

                    if (e === bossCreds.id && p === bossCreds.pass) {
                        isBoss = true;
                        document.body.classList.add('admin-mode');
                        document.getElementById('admin-settings-ui').style.display = 'block';
                        document.getElementById('auth-status').innerText = "Panel Admin";
                        document.getElementById('login-view').style.display = 'none';
                        document.getElementById('logout-btn').style.display = 'block';
                        document.getElementById('login-email').value = '';
                        document.getElementById('login-pass').value = '';
                        ["nav-title", "store-name", "store-slogan"].forEach(id => {
                            const el = document.getElementById(id);
                            if(el) el.contentEditable = true;
                        });
                        renderProducts();
                        alert("Modo Edición Activado");
                        return; 
                    }
                    auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
                };

                window.signOut = function() { 
                    if (isBoss) exitBossMode();
                    else auth.signOut().then(() => location.reload()); 
                };

                window.addProduct = function() { 
                    db.ref('productos').push({ 
                        nombre: "Nuevo Producto", precio: "$0", stock: 10, 
                        imagen: "https://dummyimage.com/400x300/1b4332/ffca3a.png&text=Nueva+Imagen",
                        imagenes: ["https://dummyimage.com/400x300/1b4332/ffca3a.png&text=Nueva+Imagen"],
                        descripcion: "Descripción detallada del producto.",
                        caracteristicas: "Color: N/A\nTamaño: N/A"
                    }); 
                };

                window.del = function(k) { if(confirm("¿Eliminar este producto?")) db.ref('productos/'+k).remove(); };
                
                db.ref('productos').on('value', snap => { 
                    allProductsData = snap.val() || {}; 
                    renderProducts(); 
                    if(currentModalKey && allProductsData[currentModalKey]) {
                        openProductModal(currentModalKey);
                    } else if (currentModalKey && !allProductsData[currentModalKey]) {
                        closeModal(true); 
                    }
                });

                db.ref('config').on('value', snap => {
                    const c = snap.val(); if(!c) return;
                    if(c.nav_title) document.getElementById('nav-title').innerText = c.nav_title;
                    if(c.name) document.getElementById('store-name').innerText = c.name;
                    if(c.slogan) document.getElementById('store-slogan').innerText = c.slogan;
                    if(c.logo) document.getElementById('store-logo').src = c.logo;
                    if(c.background) document.getElementById('dynamic-header').style.backgroundImage = `url('${c.background}')`;
                    if(c.admin) { 
                        bossCreds = c.admin; 
                        document.getElementById('edit-wa').value = bossCreds.wa; 
                        document.getElementById('edit-boss-id').value = bossCreds.id; 
                    }
                });
                
                auth.onAuthStateChanged(u => {
                    if(!isBoss) {
                        const st = document.getElementById('auth-status');
                        if(u) { 
                            st.innerText = "¡Hola, " + (u.displayName || "Usuario") + "!"; 
                            document.getElementById('login-view').style.display='none'; 
                            document.getElementById('logout-btn').style.display='block'; 
                        } else { 
                            st.innerText = "Inicia Sesión"; 
                            document.getElementById('login-view').style.display='block'; 
                            document.getElementById('logout-btn').style.display='none'; 
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Error al inicializar Firebase:", e);
        }
    </script>
</body>
</html>
