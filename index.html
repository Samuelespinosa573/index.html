<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espinas Bellas | Premium Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --verde: #1b4332;
            --verde-claro: #2d6a4f;
            --amarillo: #ffca3a;
            --crema: #f8f9fa;
            --oscuro: #081c15;
            --rojo: #e63946;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: #f0f2f5; color: var(--oscuro); padding-bottom: 100px; overflow-x: hidden; }

        /* Navbar mejorada */
        nav { 
            background: var(--verde); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .nav-logo { font-family: 'Playfair Display', serif; color: var(--amarillo); font-size: 1.6rem; font-weight: 900; outline: none; transition: var(--transition); }
        .nav-logo:focus { border-bottom: 2px solid var(--amarillo); }

        /* Header con Efectos */
        header {
            background-size: cover; background-position: center;
            padding: 100px 20px; text-align: center; color: white; 
            border-bottom: 6px solid var(--amarillo);
            position: relative; overflow: hidden;
            transition: var(--transition);
        }
        .header-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)); z-index: 1; }
        .header-content { position: relative; z-index: 2; animation: fadeIn 1s ease; }
        
        #store-logo { 
            width:150px; height:150px; border-radius:50%; border:5px solid var(--amarillo); 
            object-fit:cover; background: white; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: var(--transition);
        }
        #store-logo:hover { transform: scale(1.05); }

        /* Buscador Moderno */
        .search-container { padding: 25px 8%; background: white; margin-bottom: 20px; box-shadow: var(--shadow-soft); }
        #search-input { 
            width: 100%; padding: 15px 25px; border: 2px solid #eee; border-radius: 50px; 
            font-size: 1rem; transition: var(--transition); outline: none;
        }
        #search-input:focus { border-color: var(--verde-claro); box-shadow: 0 0 15px rgba(45, 106, 79, 0.1); }

        /* Grid y Cards Premium */
        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { 
            background: white; border-radius: 25px; overflow: hidden; 
            box-shadow: var(--shadow-soft); position: relative; text-align: center; 
            border: 1px solid rgba(0,0,0,0.03); transition: var(--transition);
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .card img.card-img { width: 100%; height: 220px; object-fit: cover; transition: 0.5s; cursor: pointer; }
        .card:hover img.card-img { transform: scale(1.05); }
        
        .badge-agotado { 
            position: absolute; top: 15px; right: 15px; background: var(--rojo); 
            color: white; padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; 
            font-weight: 800; z-index: 5; box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }

        /* Botones Estilizados */
        button { padding: 12px 25px; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-y { background: var(--amarillo); color: var(--oscuro); box-shadow: 0 4px 15px rgba(255, 202, 58, 0.2); }
        .btn-y:hover { background: #f9bc15; transform: scale(1.05); }
        .btn-v { background: var(--verde-claro); color: white; box-shadow: 0 4px 15px rgba(45, 106, 79, 0.2); }
        .btn-v:hover { background: var(--verde); transform: scale(1.05); }

        /* Sidebars Glassmorphism */
        .sidebar { 
            position: fixed; top: 0; right: -100%; width: 380px; max-width: 95%; height: 100%; 
            background: var(--glass); backdrop-filter: blur(15px); z-index: 5000; 
            transition: 0.6s cubic-bezier(0.7, 0, 0.3, 1); padding: 30px; 
            box-shadow: -15px 0 35px rgba(0,0,0,0.15); overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; transition: var(--transition); }
        .sidebar input:focus { border-color: var(--verde); box-shadow: 0 0 8px rgba(27, 67, 50, 0.2); }
        .sidebar label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; color: var(--oscuro); }

        /* Modal de Detalles del Producto */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 6000; justify-content: center; align-items: center; 
            backdrop-filter: blur(5px); animation: fadeIn 0.3s ease;
        }
        .modal-content { 
            background: white; padding: 35px; border-radius: 25px; width: 90%; max-width: 900px; 
            max-height: 90vh; overflow-y: auto; display: flex; gap: 30px; position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 2rem; color: #888; cursor: pointer; padding: 0; line-height: 1; }
        .close-modal:hover { color: var(--rojo); }
        
        .modal-gallery { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }
        .modal-main-img { width: 100%; height: 350px; object-fit: cover; border-radius: 15px; box-shadow: var(--shadow-soft); }
        .modal-thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .modal-thumbs img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; transition: var(--transition); }
        .modal-thumbs img:hover, .modal-thumbs img.active { border-color: var(--verde); opacity: 1; transform: scale(1.05); }
        
        .modal-details { flex: 1; display: flex; flex-direction: column; }
        .modal-details h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--oscuro); margin-bottom: 10px; }
        .modal-details h3 { color: var(--verde-claro); font-size: 1.8rem; margin-bottom: 20px; font-weight: 800; }
        .modal-section { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 12px; }
        .modal-section h4 { font-size: 1rem; color: var(--oscuro); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .modal-section p { color: #555; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .editable-field { padding: 5px; border-radius: 5px; transition: 0.3s; }
        .editable-field[contenteditable="true"] { background: white; border: 1px dashed var(--amarillo); outline: none; }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; padding: 25px; }
            .modal-main-img { height: 250px; }
        }

        /* Footer Admin */
        .admin-footer { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--oscuro); 
            padding: 20px; display: none; justify-content: center; gap: 15px; z-index: 4000; 
            border-top: 4px solid var(--amarillo); flex-wrap: wrap; animation: slideUp 0.5s ease;
        }
        body.admin-mode .admin-footer { display: flex; }

        #diag-panel { display: none; background: white; border-radius: 20px; padding: 25px; margin-top: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border: 1px solid #eee; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body id="main-body">

    <nav>
        <div class="nav-logo" id="nav-title" onblur="if(isBoss) saveChanges()">ESPINAS BELLAS</div>
        <div style="display:flex; gap:12px;">
            <button class="btn-y" onclick="openSidebar('cart-sidebar')">🛒 <span id="cart-count">0</span></button>
            <button class="btn-y" onclick="openSidebar('user-sidebar')">👤 Perfil</button>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 ¿Qué estás buscando hoy? Escribe aquí..." oninput="filterProducts()">
    </div>

    <header id="dynamic-header" onclick="if(isBoss) editBackground()">
        <div class="header-overlay"></div>
        <div class="header-content">
            <img src="https://via.placeholder.com/150" id="store-logo" title="Clic para cambiar logo" onclick="event.stopPropagation(); if(isBoss) editLogo()">
            <h1 id="store-name" style="font-family: 'Playfair Display', serif; font-size: 3rem; margin-top: 15px;" onblur="if(isBoss) saveChanges()">Cargando...</h1>
            <p id="store-slogan" style="font-size: 1.2rem; opacity: 0.9;" onblur="if(isBoss) saveChanges()">Calidad y Frescura garantizada</p>
        </div>
    </header>

    <section class="container">
        <div class="grid" id="product-grid"></div>

        <div id="diag-panel">
            <h3 style="color:var(--verde); margin-bottom:15px; display:flex; align-items:center; gap:10px;">🛠️ Análisis de Salud del Sistema</h3>
            <div id="diag-results" style="line-height: 1.8; color: #555;"></div>
            <button class="btn-v" onclick="document.getElementById('diag-panel').style.display='none'" style="width:100%; margin-top:20px;">Finalizar Revisión</button>
        </div>
    </section>

    <div id="product-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal(true)">&times;</button>
            
            <div class="modal-gallery">
                <img id="modal-main-img" class="modal-main-img" src="">
                <div id="modal-thumbs" class="modal-thumbs"></div>
                <button id="btn-edit-imgs" class="btn-y" style="display:none; width:100%; font-size:0.9rem;" onclick="editModalImages()">📸 Cambiar / Añadir Imágenes</button>
            </div>
            
            <div class="modal-details">
                <h2 id="modal-title" class="editable-field">Cargando...</h2>
                <h3 id="modal-price" class="editable-field">$0</h3>
                
                <div class="modal-section">
                    <h4>📝 Descripción:</h4>
                    <p id="modal-desc" class="editable-field"></p>
                </div>
                
                <div class="modal-section">
                    <h4>✨ Características (Color, Material, etc.):</h4>
                    <p id="modal-features" class="editable-field"></p>
                </div>

                <div id="modal-stock-container" style="display:none; margin-bottom:15px; background: #fff3cd; padding:10px; border-radius:8px; border: 1px solid #ffe69c;">
                    <label style="font-weight:bold; color:#856404;">📦 Stock Actual:</label>
                    <input type="number" id="modal-stock" style="width:80px; padding:5px; margin-left:10px; border:1px solid #ccc; border-radius:5px;">
                </div>

                <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
                    <button id="modal-add-cart" class="btn-v" style="padding: 18px; font-size:1.1rem; width:100%;">🛒 Añadir al Carrito</button>
                    <button id="modal-save-btn" class="btn-y" style="display:none; width:100%; background:var(--oscuro); color:white;" onclick="saveModalChanges()">💾 Guardar Cambios del Producto</button>
                </div>
            </div>
        </div>
    </div>

    <aside class="sidebar" id="user-sidebar">
        <button class="btn-y" onclick="closeSidebars()" style="margin-bottom:30px;">← Volver</button>
        
        <div id="auth-section">
            <h2 id="auth-status" style="margin-bottom:20px;">Inicia Sesión</h2>
            
            <div id="login-view">
                <input type="email" id="login-email" placeholder="Correo Electrónico o ID">
                <input type="password" id="login-pass" placeholder="Contraseña">
                <button class="btn-v" style="width:100%; margin-top:5px;" onclick="signIn()">Entrar al Sistema</button>
                <button class="btn-y" style="width:100%; margin-top:10px;" onclick="switchAuth(true)">Crear cuenta nueva</button>
            </div>
            
            <div id="register-view" style="display:none;">
                <input type="text" id="reg-name" placeholder="Nombre completo">
                <input type="email" id="reg-email" placeholder="Correo">
                <input type="password" id="reg-pass" placeholder="Contraseña">
                <button class="btn-v" style="width:100%;" onclick="signUp()">Registrarme</button>
                <button onclick="switchAuth(false)" style="background:none; color:var(--verde); width:100%; margin-top:10px; font-size:0.85rem; font-weight: bold; border:none; cursor:pointer;">Ya tengo una cuenta registrada</button>
            </div>
            
            <button id="logout-btn" class="btn-v" style="background:var(--rojo); display:none; width:100%; margin-top:20px;" onclick="signOut()">Cerrar Mi Sesión</button>
        </div>

        <div id="admin-settings-ui" style="display:none; margin-top:30px; border-top:2px solid #ddd; padding-top:25px;">
            <h3 style="color:var(--verde); margin-bottom:20px; font-size: 1.4rem;">⚙️ Panel de Control</h3>
            <div><label>WhatsApp (con código de país):</label><input type="text" id="edit-wa" placeholder="Ej: 57321..."></div>
            <div><label>Nueva ID / Correo de Acceso:</label><input type="text" id="edit-boss-id"></div>
            <div><label>Nueva Clave de Acceso:</label><input type="password" id="edit-boss-pass"></div>
            <div style="margin-top: 10px;">
                <label style="color: var(--rojo);">Confirma clave actual para guardar:</label>
                <input type="password" id="confirm-old-pass" placeholder="Clave actual" style="border: 2px solid var(--amarillo);">
            </div>
            <button class="btn-v" style="width:100%; background:var(--oscuro); margin-top: 10px;" onclick="updateAdminCreds()">Aplicar Cambios</button>
        </div>
    </aside>

    <aside class="sidebar" id="cart-sidebar">
        <button class="btn-y" onclick="closeSidebars()">← Volver</button>
        <h2 style="margin:25px 0 15px;">Tu Pedido Actual</h2>
        <div id="cart-items-list" style="max-height: 50vh; overflow-y: auto;"></div>
        <div style="padding-top: 20px; border-top: 2px solid #eee; margin-top: 20px;">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.6rem;">
                <span>Total:</span><span id="cart-total">$0</span>
            </div>
            <button class="btn-v" style="width:100%; margin-top:25px; padding: 18px;" onclick="checkout()">🚀 FINALIZAR EN WHATSAPP</button>
        </div>
    </aside>

    <footer class="admin-footer">
        <button class="btn-y" onclick="runDiagnostics()">🔍 Análisis Profundo</button>
        <button class="btn-v" onclick="addProduct()">✨ Nuevo Producto</button>
        <button class="btn-y" onclick="saveChanges()">💾 GUARDAR CUADRÍCULA</button>
        <button class="btn-v" style="background:var(--rojo);" onclick="exitBossMode()">Cerrar Edición</button>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOCuJ_tFSsKKqKXtgGvrrZgWDAPqt2uEk",
            authDomain: "fruteria-las-espinas.firebaseapp.com",
            databaseURL: "https://fruteria-las-espinas-default-rtdb.firebaseio.com",
            projectId: "fruteria-las-espinas"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let isBoss = false;
        let bossCreds = { id: "24375245", pass: "1234", wa: "3212968875" };
        let allProductsData = {};
        let cart = [];
        let currentModalKey = null;

        function openSidebar(id) { document.getElementById(id).classList.add('active'); }
        function closeSidebars() { document.querySelectorAll('.sidebar').forEach(s => s.classList.remove('active')); }

        function exitBossMode() {
            isBoss = false;
            document.body.classList.remove('admin-mode');
            document.getElementById('admin-settings-ui').style.display = 'none';
            ["nav-title", "store-name", "store-slogan"].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.contentEditable = false;
            });
            
            document.getElementById('auth-status').innerText = "Inicia Sesión";
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'none';
            
            closeSidebars(); renderProducts();
        }

        // Renderizado de la cuadrícula
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = "";
            for(let k in allProductsData) {
                const p = allProductsData[k];
                const stock = p.stock || 0;
                
                // Soporte para múltiples imágenes (fallback a 'imagen' simple si no existe el array)
                const mainImg = (p.imagenes && p.imagenes.length > 0) ? p.imagenes[0] : (p.imagen || "https://via.placeholder.com/400x300?text=Sin+Imagen");

                grid.innerHTML += `
                    <div class="card" data-key="${k}" data-name="${(p.nombre||'').toLowerCase()}">
                        ${stock <= 0 ? '<div class="badge-agotado">AGOTADO</div>' : ''}
                        <img src="${mainImg}" class="card-img" onclick="openProductModal('${k}')" title="Clic para ver detalles">
                        
                        <div style="padding:20px; flex-grow: 1; display: flex; flex-direction: column;">
                            <h3 class="e-n" contenteditable="${isBoss}">${p.nombre || 'Producto'}</h3>
                            <p class="e-p" contenteditable="${isBoss}" style="color:var(--verde-claro); font-weight:800; font-size:1.2rem; margin: 10px 0;">${p.precio || '$0'}</p>
                            ${isBoss ? `<div style="font-size:0.8rem; color:#888;">Stock: <input type="number" class="e-s" value="${stock}" style="width:60px; padding:4px;"></div>` : ''}
                            
                            <div style="display: flex; gap: 10px; margin-top: auto; padding-top: 15px;">
                                <button class="btn-y" style="flex:1; font-size: 0.9rem;" onclick="openProductModal('${k}')">👁️ Detalles</button>
                                <button class="btn-v" style="flex:1; font-size: 0.9rem;" onclick="addToCart('${k}')" ${stock <= 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                                    ${stock <= 0 ? 'Agotado' : '🛒 Añadir'}
                                </button>
                            </div>
                            
                            ${isBoss ? `<p onclick="del('${k}')" style="color:red; cursor:pointer; font-size:0.75rem; margin-top:15px; font-weight:bold; letter-spacing:1px;">🗑️ ELIMINAR</p>` : ''}
                        </div>
                    </div>`;
            }
        }

        // --- SISTEMA DEL MODAL (VISTA DETALLADA) ---
        function openProductModal(k) {
            currentModalKey = k;
            const p = allProductsData[k];
            const stock = p.stock || 0;
            
            // Cargar Galería
            let imgs = (p.imagenes && p.imagenes.length > 0) ? p.imagenes : (p.imagen ? [p.imagen] : ["https://via.placeholder.com/400x300?text=Sin+Imagen"]);
            
            document.getElementById('modal-main-img').src = imgs[0];
            let thumbHTML = '';
            imgs.forEach((img, idx) => {
                thumbHTML += `<img src="${img}" class="${idx === 0 ? 'active' : ''}" onclick="changeModalMainImg(this, '${img}')">`;
            });
            document.getElementById('modal-thumbs').innerHTML = thumbHTML;

            // Cargar Textos
            document.getElementById('modal-title').innerText = p.nombre || "Producto sin nombre";
            document.getElementById('modal-price').innerText = p.precio || "$0";
            document.getElementById('modal-desc').innerText = p.descripcion || "No hay una descripción detallada para este producto todavía.";
            document.getElementById('modal-features').innerText = p.caracteristicas || "Características no especificadas.";

            // Configurar Botón Carrito
            const btnCart = document.getElementById('modal-add-cart');
            btnCart.onclick = () => { addToCart(k); };
            if(stock <= 0) {
                btnCart.disabled = true; btnCart.innerText = "Producto Agotado"; btnCart.style.background = "var(--rojo)";
            } else {
                btnCart.disabled = false; btnCart.innerText = "🛒 Añadir al Carrito"; btnCart.style.background = "var(--verde-claro)";
            }

            // Configurar Controles de Administrador en Modal
            ['modal-title', 'modal-price', 'modal-desc', 'modal-features'].forEach(id => {
                document.getElementById(id).contentEditable = isBoss;
            });
            
            document.getElementById('modal-stock-container').style.display = isBoss ? 'flex' : 'none';
            if(isBoss) document.getElementById('modal-stock').value = stock;
            
            document.getElementById('modal-save-btn').style.display = isBoss ? 'block' : 'none';
            document.getElementById('btn-edit-imgs').style.display = isBoss ? 'block' : 'none';

            document.getElementById('product-modal').style.display = 'flex';
        }

        function changeModalMainImg(element, src) {
            document.getElementById('modal-main-img').src = src;
            document.querySelectorAll('#modal-thumbs img').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }

        function closeModal(force = false, e = null) {
            if(force || (e && (e.target.classList.contains('modal-overlay') || e.target.classList.contains('close-modal')))) {
                document.getElementById('product-modal').style.display = 'none';
                currentModalKey = null;
            }
        }

        function saveModalChanges() {
            if(!isBoss || !currentModalKey) return;
            const up = {};
            up[`productos/${currentModalKey}/nombre`] = document.getElementById('modal-title').innerText;
            up[`productos/${currentModalKey}/precio`] = document.getElementById('modal-price').innerText;
            up[`productos/${currentModalKey}/descripcion`] = document.getElementById('modal-desc').innerText;
            up[`productos/${currentModalKey}/caracteristicas`] = document.getElementById('modal-features').innerText;
            up[`productos/${currentModalKey}/stock`] = parseInt(document.getElementById('modal-stock').value) || 0;
            
            db.ref().update(up).then(() => { alert('¡Detalles del producto guardados exitosamente!'); });
        }

        function editModalImages() {
            if(!isBoss || !currentModalKey) return;
            const urls = prompt("Ingresa las URLs de las imágenes separadas por una COMA (,):\n\nEjemplo: url1.jpg, url2.png, url3.jpg");
            if(urls) {
                const arr = urls.split(',').map(u => u.trim()).filter(u => u !== '');
                if(arr.length > 0) {
                    db.ref(`productos/${currentModalKey}/imagenes`).set(arr);
                    db.ref(`productos/${currentModalKey}/imagen`).set(arr[0]); // Por compatibilidad
                    alert("Imágenes guardadas. Se actualizarán enseguida.");
                    openProductModal(currentModalKey); // Recargar modal
                }
            }
        }
        // --- FIN SISTEMA MODAL ---

        function addToCart(key) {
            const p = allProductsData[key], existing = cart.find(i => i.key === key);
            const currentStock = p.stock || 0;
            if(existing) {
                if(existing.qty < currentStock) existing.qty++; else return alert("Lo sentimos, no hay más unidades disponibles de este producto.");
            } else { cart.push({key, name: p.nombre, price: p.precio, qty: 1}); }
            updateCartUI();
            
            // Pequeño feedback visual
            const btn = document.getElementById('cart-count');
            btn.style.transform = 'scale(1.3)';
            setTimeout(() => btn.style.transform = 'scale(1)', 300);
        }

        function updateCartQty(key, delta) {
            const item = cart.find(i => i.key === key), p = allProductsData[key];
            if(item) {
                item.qty += delta;
                if(item.qty > (p.stock || 0)) { item.qty = (p.stock || 0); alert("Stock máximo alcanzado"); }
                if(item.qty <= 0) cart = cart.filter(i => i.key !== key);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list'); list.innerHTML = "";
            let total = 0, count = 0;
            cart.forEach(item => {
                const pNum = parseInt(item.price.replace(/\D/g,'')) || 0; 
                const sub = pNum * item.qty;
                total += sub; count += item.qty;
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background:white; padding:15px; border-radius:15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
                        <div><b style="font-size:1.1rem;">${item.name}</b><br><small style="color:var(--verde-claro); font-weight:700;">$${sub.toLocaleString()}</small></div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button style="padding: 5px 10px;" onclick="updateCartQty('${item.key}', -1)">-</button>
                            <span style="font-weight:800;">${item.qty}</span>
                            <button style="padding: 5px 10px;" onclick="updateCartQty('${item.key}', 1)">+</button>
                        </div>
                    </div>`;
            });
            document.getElementById('cart-total').innerText = "$" + total.toLocaleString();
            document.getElementById('cart-count').innerText = count;
        }

        function checkout() {
            if(cart.length === 0) return alert("Tu carrito está vacío.");
            let msg = `*🛒 NUEVO PEDIDO - ESPINAS BELLAS*\n---------------------------\n`;
            cart.forEach(i => msg += `✅ ${i.qty}x ${i.name} (${i.price})\n`);
            msg += `---------------------------\n*💰 TOTAL A PAGAR: ${document.getElementById('cart-total').innerText}*`;
            
            const up = {};
            cart.forEach(i => {
                const nS = (allProductsData[i.key].stock || 0) - i.qty;
                up[`productos/${i.key}/stock`] = nS < 0 ? 0 : nS;
            });
            db.ref().update(up).then(() => { 
                window.open(`https://wa.me/${bossCreds.wa.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank'); 
                cart = []; updateCartUI(); closeSidebars(); 
            });
        }
